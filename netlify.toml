[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # NEXT_PUBLIC_* values are intentionally inlined into client bundles.
  # Do not mark them as "Secret" in the Netlify UI; also omit them from scanning.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_DEFAULT_LOCALE,NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache,.next/cache"

[[plugins]]
  package = "@netlify/plugin-nextjs"
